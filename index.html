<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luqman | Vast™</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <video autoplay muted loop id="bg-video">
        <source src="assets/bg.mp4" type="video/mp4">
    </video>

    <div class="main-wrapper">
        <div class="glass-card">
            <div class="pfp-container">
                <img src="assets/pfp.png" alt="Profile" class="pfp">
                <div class="halo">😇</div>
            </div>

            <h1 class="username">Luqman</h1>
            
            <div class="typewriter">
                <span id="typewriter-text"></span><span class="cursor">|</span>
            </div>

            <div class="badge-grid">
                <div class="badge"><img src="assets/aetherian.svg" class="badge-icon"> Ætherian</div>
                <div class="badge">🎨 Artist</div>
                <div class="badge">🥊 Striker</div>
                <div class="badge">📚 Reader</div>
                <div class="badge">🖌️ Graphic Designer</div>
                <div class="badge">💎 Premium</div>
            </div>

            <hr class="separator">

            <div class="button-container">
                <a href="https://discord.gg/cy3t9tQbMT" class="glass-button">
                    <img src="assets/discord-icon.svg" alt="Discord">
                    <div class="btn-text">
                        <span>Join the Server</span>
                        <small>ÆTHER'</small>
                    </div>
                </a>
                
                <a href="#" class="glass-button">
                    <img src="assets/vast-logo.png" alt="Vast">
                    <div class="btn-text">
                        <span>Vast™</span>
                        <small>Building a Community</small>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
